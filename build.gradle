tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set("jar")
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set temporaryDir

    dependsOn configurations.includeInternal

    def files = configurations.includeInternal.incoming.getArtifacts().getArtifactFiles().filter {
        it.name.startsWith('rocksdb')
    }
    
    from {->zipTree(files.first())}
    archiveFileName.set(providers.provider{files.first().name})

    def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def hostNative = hostOs.contains('mac')
            ? (hostArch in ['aarch64', 'arm64'] ? 'librocksdbjni-osx-arm64.jnilib' : 'librocksdbjni-osx-x86_64.jnilib')
            : hostOs.contains('win')
            ? 'librocksdbjni-win64.dll'
            : (hostArch in ['aarch64', 'arm64'] ? 'librocksdbjni-linux-aarch64.so' : 'librocksdbjni-linux64.so')

    exclude {
        def fileName = it.name.tokenize('/').last()
        def nativeLibrary = fileName.endsWith('.jnilib') || fileName.endsWith('.so') || fileName.endsWith('.dll')
        // Keep both desktop platforms even when packaging on Windows.
        def desktopNatives = ['librocksdbjni-win64.dll', 'librocksdbjni-osx-arm64.jnilib', 'librocksdbjni-osx-x86_64.jnilib']
        return nativeLibrary && fileName != hostNative && !(fileName in desktopNatives)
    }
}




processIncludeJars {
    outputs.cacheIf {true}
    if (!INCLUDE_OTHER_ARCHS) {
        dependsOn makeExcludedRocksDB
        jars = jars.filter {!it.name.startsWith('rocksdb')}
        jars.from(makeExcludedRocksDB)
    }
}

