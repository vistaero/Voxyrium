def INCLUDE_OTHER_ARCHS = "true".equalsIgnoreCase(project.findProperty("includeOtherArchs"))

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

// Dependencies are selected at configuration time; every target gets a
// separate worktree and a JAR with an exact Minecraft version requirement.
def targets = [
    '1.21':    ['0.102.0+1.21', 'mc1.21.1-0.6.13-fabric', '1.8.8+1.21.1-fabric', '11.0.4'],
    '1.21.1':  ['0.116.17+1.21.1', 'mc1.21.1-0.6.13-fabric', '1.8.8+1.21.1-fabric', '11.0.4'],
    '1.21.2':  ['0.106.1+1.21.2', 'mc1.21.3-0.6.13-fabric', '1.8.0+1.21.3-fabric', '12.0.1'],
    '1.21.3':  ['0.114.1+1.21.3', 'mc1.21.3-0.6.13-fabric', '1.8.1+1.21.3-fabric', '12.0.1'],
    '1.21.4':  ['0.119.4+1.21.4', 'mc1.21.4-0.6.13-fabric', '1.8.8+1.21.4-fabric', '13.0.4'],
    '1.21.5':  ['0.128.2+1.21.5', 'mc1.21.5-0.6.13-fabric', '1.8.11+1.21.5-fabric', '14.0.2'],
    '1.21.6':  ['0.128.2+1.21.6', 'mc1.21.8-0.7.3-fabric', '1.9.6+1.21.8-fabric', '15.0.2'],
    '1.21.7':  ['0.129.0+1.21.7', 'mc1.21.8-0.7.3-fabric', '1.9.6+1.21.8-fabric', '15.0.2'],
    '1.21.8':  ['0.136.1+1.21.8', 'mc1.21.8-0.7.3-fabric', '1.9.6+1.21.8-fabric', '15.0.2'],
    '1.21.9':  ['0.134.1+1.21.9', 'mc1.21.10-0.7.3-fabric', '1.9.7+1.21.10-fabric', '16.0.1'],
    '1.21.10': ['0.138.4+1.21.10', 'mc1.21.10-0.7.3-fabric', '1.9.7+1.21.10-fabric', '16.0.1'],
    '1.21.11': ['0.140.2+1.21.11', 'mc1.21.11-0.8.12-fabric', '1.10.7+1.21.11-fabric', '17.0.0-alpha.1']
]
def target = targets[project.minecraft_version]
if (target == null) {
    throw new GradleException("Unsupported Minecraft target: " + project.minecraft_version)
}
project.ext.fabric_version = target[0]
def sodiumVersion = target[1]
def irisVersion = target[2]
def modmenuVersion = target[3]
def lithiumVersions = [
    '1.21': 'mc1.21.1-0.15.2-fabric',
    '1.21.1': 'mc1.21.1-0.15.4-fabric',
    '1.21.2': 'mc1.21.3-0.14.6-fabric',
    '1.21.3': 'mc1.21.3-0.14.6-fabric',
    '1.21.4': 'mc1.21.4-0.15.3-fabric',
    '1.21.5': 'mc1.21.5-0.16.3-fabric',
    '1.21.6': 'mc1.21.6-0.17.0-fabric',
    '1.21.7': 'mc1.21.7-0.18.0-fabric',
    '1.21.8': 'mc1.21.8-0.18.1-fabric',
    '1.21.9': 'mc1.21.9-0.19.2-fabric',
    '1.21.10': 'mc1.21.10-0.20.1-fabric',
    '1.21.11': 'mc1.21.11-0.21.0-fabric'
]
def selectedAccessWidener = file("src/main/resources/voxy.accesswidener")

// Older releases are built from their matching historical source snapshots.
// The current source tree remains the native implementation for 1.21.11.
def compatibilitySource = [
    '1.21':    [ref: '67edb4a44b2f446816c2d39f1e440c6f66c9026f', yarn: '1.21+build.2', legacy: true,
                fabric: '0.100.1+1.21', sodium: 'mc1.21-0.5.9', iris: '1.7.3+1.21', modmenu: '11.0.1'],
    '1.21.1':  [ref: '67edb4a44b2f446816c2d39f1e440c6f66c9026f', yarn: '1.21.1+build.3', legacy: true,
                fabric: '0.116.17+1.21.1', sodium: 'mc1.21-0.5.11', iris: '1.7.3+1.21', modmenu: '11.0.4'],
    '1.21.2':  [ref: '5e5d0c8051f66e65558ded39b862c528e71b8b99', yarn: '1.21.2+build.1', historical: '1213',
                fabric: '0.106.1+1.21.2', sodium: 'mc1.21.3-0.6.0-fabric', iris: '1.8.0+1.21.3-fabric', modmenu: '12.0.0-beta.1'],
    '1.21.3':  [ref: '5e5d0c8051f66e65558ded39b862c528e71b8b99', yarn: '1.21.3+build.2', historical: '1213',
                fabric: '0.108.0+1.21.3', sodium: 'mc1.21.3-0.6.0-fabric', iris: '1.8.0+1.21.3-fabric', modmenu: '12.0.0-beta.1'],
    '1.21.10': [ref: 'upstream/mc12110']
][project.minecraft_version]
if (compatibilitySource?.legacy || compatibilitySource?.historical) {
    project.ext.fabric_version = compatibilitySource.fabric
    sodiumVersion = compatibilitySource.sodium
    irisVersion = compatibilitySource.iris
    modmenuVersion = compatibilitySource.modmenu
}
if (compatibilitySource != null) {
    def compatibilitySources = file("${buildDir}/generated/compat-${project.minecraft_version}/java")
    def compatibilityResources = file("${buildDir}/generated/compat-${project.minecraft_version}/resources")
    def compatibilityAccessWidener = new File(compatibilityResources, 'voxy.accesswidener')
    compatibilityAccessWidener.parentFile.mkdirs()
    compatibilityAccessWidener.text = providers.exec {
        commandLine 'git', 'show', "${compatibilitySource.ref}:src/main/resources/voxy.accesswidener"
    }.standardOutput.asText.get()
    selectedAccessWidener = compatibilityAccessWidener
    tasks.register('prepareCompatibilitySources') {
        outputs.dir(compatibilitySources)
        doLast {
            def destination = compatibilitySources
            delete destination
            def files = providers.exec {
                commandLine 'git', 'ls-tree', '-r', '--name-only', compatibilitySource.ref, 'src/main/java'
            }.standardOutput.asText.get().readLines()
            files.each { path ->
                def output = new File(destination, path.substring('src/main/java/'.length()))
                output.parentFile.mkdirs()
                def contents = providers.exec {
                    commandLine 'git', 'show', "${compatibilitySource.ref}:${path}"
                }.standardOutput.asText.get()
                if (path.endsWith('/ModelStore.java')) {
                    contents = contents.replaceAll('(?s)int mipLvl = \\(\\(TextureAtlas\\).*?\\.mipLevel;', 'int mipLvl = Integer.numberOfTrailingZeros(ModelFactory.MODEL_TEXTURE_SIZE);')
                }
                if (project.minecraft_version == '1.21.2' && path.endsWith('/LightMapHelper.java')) {
                    contents = contents.replace(
                            'var lmt = MinecraftClient.getInstance().gameRenderer.getLightmapTextureManager().texture.getImage();',
                            'var lmt = MinecraftClient.getInstance().gameRenderer.getLightmapTextureManager().lightmapFramebuffer.getImage();')
                }
                output.text = contents
            }
            def resourceNames = providers.exec {
                commandLine 'git', 'ls-tree', '-r', '--name-only', compatibilitySource.ref, 'src/main/resources'
            }.standardOutput.asText.get().readLines().findAll { path ->
                path.endsWith('/fabric.mod.json') || path.endsWith('/voxy.accesswidener') || path.endsWith('.mixins.json')
            }.collect { path -> path.substring('src/main/resources/'.length()) }
            resourceNames.each { name ->
                def output = new File(compatibilityResources, name)
                output.parentFile.mkdirs()
                def contents = providers.exec {
                    commandLine 'git', 'show', "${compatibilitySource.ref}:src/main/resources/${name}"
                }.standardOutput.asText.get()
                if (compatibilitySource != null && name == 'fabric.mod.json') {
                    contents = contents.replaceFirst('"minecraft": "[^"]+"', '"minecraft": "' + project.minecraft_version + '"')
                    if (compatibilitySource?.legacy || compatibilitySource?.historical) {
                        contents = contents.replace('"sodium": "*"', '"sodium": "=' + sodiumVersion.split('-')[1] + '"')
                    }
                }
                output.text = contents
            }
            // Loom resolves the access widener during configuration, before
            // generated resources exist; mirror the selected file at the
            // conventional path for this isolated build worktree.
            resourceNames.each { name ->
                file("src/main/resources/${name}").text = new File(buildDir, "generated/compat-${project.minecraft_version}/resources/${name}").text
            }
        }
    }
    sourceSets.main.java.setSrcDirs([compatibilitySources])
    tasks.named('compileJava') { dependsOn 'prepareCompatibilitySources' }
    processResources {
        dependsOn 'prepareCompatibilitySources'
    }
}

