                if (project.minecraft_version in ['1.21.9', '1.21.10']) {
                    def menu = new File(compatibilitySources,
                            'me/cortex/voxy/client/config/LegacySodiumConfigMenu.java')
                    def contents = menu.text
                            .replace('import net.minecraft.text.Text;', 'import net.minecraft.network.chat.Component;')
                            .replace('Text.translatable', 'Component.translatable')
                            .replace('Text[]', 'Component[]')
                            .replace('new Text[', 'new Component[')
                    menu.text = contents
                }
            }
            if (project.minecraft_version in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10']) {
                copy {
                    from 'src/compatibility/java/me/cortex/voxy/client/core/LegacySSAO.java'
                    into new File(compatibilitySources, 'me/cortex/voxy/client/core')
                }
                if (project.minecraft_version in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7']) {
                    def ssao = new File(compatibilitySources, 'me/cortex/voxy/client/core/LegacySSAO.java')
                    ssao.text = ssao.text.replace('viewport.MVP', 'new Matrix4f(viewport.projection).mul(viewport.modelView)')
                }
                if (project.minecraft_version in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4']) {
                    def ssao = new File(compatibilitySources, 'me/cortex/voxy/client/core/LegacySSAO.java')
                    def contents = ssao.text
                    if (project.minecraft_version != '1.21.4') {
                        contents = contents.replace('import me.cortex.voxy.client.core.gl.Capabilities;',
                                'import me.cortex.voxy.client.core.Capabilities;')
                    }
                    contents = contents.replaceAll(
                            '(?s)        if \\(mode == Mode\\.AUTO\\) \\{.*?        \\}\r?\n\r?\n        this\\.improved',
                            '        if (mode == Mode.AUTO) { mode = Mode.BASIC; }\n\n        this.improved')
                    ssao.text = contents
                }
                copy {
                    from 'src/main/resources/assets/voxy/shaders/post/ssao.comp'
                    into new File(compatibilityResources, 'assets/voxy/shaders/post')
                }
                copy {
                    from 'src/main/resources/assets/voxy/shaders/util/depthutils.glsl'
                    into new File(compatibilityResources, 'assets/voxy/shaders/util')
                }
            }
            if (project.minecraft_version in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7']) {
                copy {
                    from 'src/compatibility/resources/legacy-post'
                    into compatibilityResources
                }
            }
        }
    }
    sourceSets.main.java.setSrcDirs([compatibilitySources])
    sourceSets.main.resources.setSrcDirs([compatibilityResources])
    tasks.named('compileJava') { dependsOn 'prepareCompatibilitySources' }
    tasks.named('validateAccessWidener') { dependsOn 'prepareCompatibilitySources' }
    processResources {
        dependsOn 'prepareCompatibilitySources'
    }
}

