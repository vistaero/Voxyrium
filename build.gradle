def selectedAccessWidener = file("src/main/resources/voxy.accesswidener")

// Older releases are built from their matching historical source snapshots.
// The current source tree remains the native implementation for 1.21.11.
def compatibilitySource = [
    '1.21':    [ref: '67edb4a44b2f446816c2d39f1e440c6f66c9026f', yarn: '1.21+build.2', legacy: true,
                fabric: '0.100.1+1.21', sodium: 'mc1.21.1-0.6.13-fabric', iris: '1.8.8+1.21.1-fabric', modmenu: '11.0.1'],
    '1.21.1':  [ref: '67edb4a44b2f446816c2d39f1e440c6f66c9026f', yarn: '1.21.1+build.3', legacy: true,
                fabric: '0.116.17+1.21.1', sodium: 'mc1.21.1-0.8.13-fabric', iris: '1.8.14-beta.1+1.21.1-fabric', modmenu: '11.0.4'],
    '1.21.2':  [ref: '5e5d0c8051f66e65558ded39b862c528e71b8b99', yarn: '1.21.2+build.1', historical: '1213',
                fabric: '0.106.1+1.21.2', sodium: 'mc1.21.2-0.6.0-beta.3-fabric', iris: '1.8.0-beta.6+1.21.2-fabric', modmenu: '12.0.0-beta.1'],
    '1.21.3':  [ref: '5e5d0c8051f66e65558ded39b862c528e71b8b99', yarn: '1.21.3+build.2', historical: '1213',
                fabric: '0.108.0+1.21.3', sodium: 'mc1.21.3-0.6.8-fabric', iris: '1.8.1+1.21.3-fabric', modmenu: '12.0.0-beta.1'],
    '1.21.4':  [ref: 'b8fda63e', yarn: '1.21.4+build.8', historical: '1214',
                fabric: '0.114.2+1.21.4', sodium: 'mc1.21.4-0.6.13-fabric', iris: '1.8.8+1.21.4-fabric', modmenu: '13.0.0'],
    '1.21.5':  [ref: 'upstream/mc_1215', yarn: '1.21.5+build.1', historical: '1215',
                fabric: '0.128.2+1.21.5', sodium: 'mc1.21.5-0.6.13-fabric', iris: '1.8.11+1.21.5-fabric', modmenu: '14.0.2', lithium: 'mc1.21.5-0.16.0-fabric'],
    '1.21.6':  [ref: '388764e9', yarn: '1.21.6+build.1', historical: '1216',
                fabric: '0.127.0+1.21.6', sodium: 'mc1.21.8-0.7.3-fabric', iris: '1.9.6+1.21.8-fabric', modmenu: '15.0.0-beta.1', lithium: 'mc1.21.6-0.17.0-fabric'],
    '1.21.7':  [ref: '3e193bb6', yarn: '1.21.7+build.1'],
    '1.21.8':  [ref: 'upstream/mc_1217', yarn: '1.21.8+build.1'],
    '1.21.9':  [ref: 'upstream/mc12110'],
    '1.21.10': [ref: 'upstream/mc12110']
][project.minecraft_version]
if (compatibilitySource?.legacy || compatibilitySource?.historical) {
    project.ext.fabric_version = compatibilitySource.fabric
    sodiumVersion = compatibilitySource.sodium
    irisVersion = compatibilitySource.iris
    modmenuVersion = compatibilitySource.modmenu
}
if (compatibilitySource != null) {
    def compatibilitySources = file("${buildDir}/generated/compat-${project.minecraft_version}/java")
    def compatibilityResources = file("${buildDir}/generated/compat-${project.minecraft_version}/resources")
    def compatibilityAccessWidener = new File(compatibilityResources, 'voxy.accesswidener')
    compatibilityAccessWidener.parentFile.mkdirs()
    compatibilityAccessWidener.text = providers.exec {
        commandLine 'git', 'show', "${compatibilitySource.ref}:src/main/resources/voxy.accesswidener"
    }.standardOutput.asText.get()
    selectedAccessWidener = compatibilityAccessWidener
    tasks.register('prepareCompatibilitySources') {
        outputs.dir(compatibilitySources)
        outputs.dir(compatibilityResources)
        inputs.dir(file('src/compatibility/java'))
        inputs.dir(file('src/compatibility/java-modern'))
        inputs.file(file('build.gradle'))
        doLast {
            def destination = compatibilitySources
            delete destination
            delete compatibilityResources
            def files = providers.exec {
                commandLine 'git', 'ls-tree', '-r', '--name-only', compatibilitySource.ref, 'src/main/java'
            }.standardOutput.asText.get().readLines()
            files.findAll { path ->
                !(project.minecraft_version in ['1.21', '1.21.1'] && path.endsWith('/mixin/nvidium/MixinRenderPipeline.java'))
            }.each { path ->
                def output = new File(destination, path.substring('src/main/java/'.length()))
                output.parentFile.mkdirs()
                def contents = providers.exec {
                    commandLine 'git', 'show', "${compatibilitySource.ref}:${path}"
                }.standardOutput.asText.get()
                if (project.minecraft_version == '1.21.7' && path.endsWith('/PostProcessing.java')) {
                    // Keep the Java side paired with the shared legacy fog/SSAO shaders.
                    contents = providers.exec {
                        commandLine 'git', 'show', "388764e9:${path}"
                    }.standardOutput.asText.get()
                }
                if (path.endsWith('/VoxyConfig.java')) {
                    contents = contents.replace('public String defaultSaveConfig;',
                            'public String defaultSaveConfig = ContextSelectionSystem.DEFAULT_STORAGE_CONFIG;')
                    contents = contents.replace('var cfg = GSON.fromJson(reader, VoxyConfig.class);',
                            'var cfg = GSON.fromJson(reader, VoxyConfig.class);\n                if (cfg == null) cfg = new VoxyConfig();')
                    contents = contents.replace('if (cfg.defaultSaveConfig == null)',
                            'if (cfg.defaultSaveConfig == null || cfg.defaultSaveConfig.isBlank() || cfg.defaultSaveConfig.trim().equals("null"))')
                    def marker = 'public boolean enabled = true;'
                    def additions = []
                    if (!contents.contains('public boolean enableRendering')) {
                        additions.add('    public boolean enableRendering = true;')
                    }
                    if (!contents.contains('public int serviceThreads')) {
                        additions.add('    public int serviceThreads = Math.max(Runtime.getRuntime().availableProcessors() / 2, 1);')
                    }
                    def hasDistanceField = contents.readLines().any { line ->
                        def declaration = line.trim()
                        declaration.startsWith('public int renderDistance') ||
                                declaration.startsWith('public int sectionRenderDistance') ||
                                declaration.startsWith('public float sectionRenderDistance')
                    }
                    if (!hasDistanceField) {
                        additions.add('    public int sectionRenderDistance = 16;')
                    }
                    if (!contents.contains('public boolean dontUseSodiumBuilderThreads')) {
                        additions.add('    public boolean dontUseSodiumBuilderThreads = false;')
                    }
                    if (!contents.contains('public String fogMode')) {
                        additions.add('    public String fogMode = "fog_and_fade";')
                    }
                    if (!contents.contains('public String ssaoMode')) {
                        additions.add('    public String ssaoMode = "auto";')
                    }
                    if (!additions.isEmpty()) {
                        contents = contents.replace(marker, marker + '\n' + additions.join('\n'))
                    }
                }
                if (path.endsWith('/ModelStore.java')) {
                    contents = contents.replaceAll('(?s)int mipLvl = \\(\\(TextureAtlas\\).*?\\.mipLevel;', 'int mipLvl = Integer.numberOfTrailingZeros(ModelFactory.MODEL_TEXTURE_SIZE);')
                }
                if (project.minecraft_version in ['1.21.2', '1.21.3'] && path.endsWith('/ModelTextureBakery.java')) {
                    // The historical bakery runs while chunks are being loaded. Its custom
                    // translucent blend factors must not leak into Minecraft's next frame/GUI.
                    def replaceBakery = { before, after ->
                        if (!contents.contains(before)) {
                            throw new GradleException("Failed to adapt model bakery for ${project.minecraft_version}: ${before}")
                        }
                        contents = contents.replace(before, after)
                    }
                    replaceBakery('        this.glState.capture();\n        var model =', '''        this.glState.capture();
        int oldDrawFB = glGetInteger(GL_DRAW_FRAMEBUFFER_BINDING);
        int oldReadFB = glGetInteger(GL_READ_FRAMEBUFFER_BINDING);
        int oldProgram = glGetInteger(GL_CURRENT_PROGRAM);
        int oldVAO = glGetInteger(GL_VERTEX_ARRAY_BINDING);
        int[] oldViewport = new int[4];
        glGetIntegerv(GL_VIEWPORT, oldViewport);
        float[] oldClearColor = new float[4];
        glGetFloatv(GL_COLOR_CLEAR_VALUE, oldClearColor);
        double oldClearDepth = glGetDouble(GL_DEPTH_CLEAR_VALUE);
        double[] oldDepthRange = new double[2];
        glGetDoublev(GL_DEPTH_RANGE, oldDepthRange);
        boolean oldDepthMask = glGetBoolean(GL_DEPTH_WRITEMASK);
        int oldBlendSrcRGB = glGetInteger(GL_BLEND_SRC_RGB);
        int oldBlendDstRGB = glGetInteger(GL_BLEND_DST_RGB);
        int oldBlendSrcAlpha = glGetInteger(GL_BLEND_SRC_ALPHA);
        int oldBlendDstAlpha = glGetInteger(GL_BLEND_DST_ALPHA);
        int oldStencilMask = glGetInteger(GL_STENCIL_WRITEMASK);
        int oldStencilFunc = glGetInteger(GL_STENCIL_FUNC);
        int oldStencilRef = glGetInteger(GL_STENCIL_REF);
        int oldStencilValueMask = glGetInteger(GL_STENCIL_VALUE_MASK);
        int oldStencilFail = glGetInteger(GL_STENCIL_FAIL);
        int oldStencilDepthFail = glGetInteger(GL_STENCIL_PASS_DEPTH_FAIL);
        int oldStencilDepthPass = glGetInteger(GL_STENCIL_PASS_DEPTH_PASS);
        try {
        var model =''')
                    replaceBakery('        int oldFB = GlStateManager.getBoundFramebuffer();\n', '')
                    // BufferRenderer caches the last Minecraft VertexBuffer, whereas
                    // Voxy and Sodium bind VAOs directly. In Sodium 0.6.0-beta.3
                    // and 0.6.8 this can skip the VAO bind for a subsequent
                    // glDrawElements, leaving no valid element buffer on AMD.
                    replaceBakery('''            BufferRenderer.draw(bb.end());''', '''            BufferRenderer.resetCurrentVertexBuffer();
            BufferRenderer.draw(bb.end());''')
                    replaceBakery('        renderLayer.endDrawing();\n        glDisable(GL_STENCIL_TEST);', '''        // startDrawing() was never called: endDrawing() resets Minecraft's
        // shared render state instead of closing a bakery-specific layer.
        glDisable(GL_STENCIL_TEST);''')
                    replaceBakery('''        glBindFramebuffer(GL_FRAMEBUFFER, oldFB);
        GL11C.glViewport(GlStateManager.Viewport.getX(), GlStateManager.Viewport.getY(), GlStateManager.Viewport.getWidth(), GlStateManager.Viewport.getHeight());

        //TODO: FIXME: fully revert the state of opengl

        this.glState.restore();
    }''', '''        } finally {
            glBindFramebuffer(GL_DRAW_FRAMEBUFFER, oldDrawFB);
            glBindFramebuffer(GL_READ_FRAMEBUFFER, oldReadFB);
            GL11C.glViewport(oldViewport[0], oldViewport[1], oldViewport[2], oldViewport[3]);
            glClearColor(oldClearColor[0], oldClearColor[1], oldClearColor[2], oldClearColor[3]);
            glClearDepth(oldClearDepth);
            glDepthRange(oldDepthRange[0], oldDepthRange[1]);
            glDepthMask(oldDepthMask);
            glBlendFuncSeparate(oldBlendSrcRGB, oldBlendDstRGB, oldBlendSrcAlpha, oldBlendDstAlpha);
            glStencilMask(oldStencilMask);
            glStencilFunc(oldStencilFunc, oldStencilRef, oldStencilValueMask);
            glStencilOp(oldStencilFail, oldStencilDepthFail, oldStencilDepthPass);
            glUseProgram(oldProgram);
            glBindVertexArray(oldVAO);
            BufferRenderer.resetCurrentVertexBuffer();
            this.glState.restore();
        }
    }''')
                }
                if (project.minecraft_version in ['1.21.2', '1.21.3'] && path.endsWith('/LightMapHelper.java')) {
                    // The 1.21.2/1.21.3 historical snapshot reads the lightmap
                    // through a stale CPU image. Cortex fixed the dark-terrain
                    // regression by sampling Minecraft's live GPU lightmap.
                    contents = providers.exec {
                        commandLine 'git', 'show', "5979b178:src/main/java/me/cortex/voxy/client/core/rendering/LightMapHelper.java"
                    }.standardOutput.asText.get()
                }
                if (project.minecraft_version in ['1.21.2', '1.21.3'] && path.endsWith('/MDICSectionRenderer.java')) {
                    contents = providers.exec {
                        commandLine 'git', 'show', "5979b178:src/main/java/me/cortex/voxy/client/core/rendering/section/MDICSectionRenderer.java"
                    }.standardOutput.asText.get()
                }
                if (project.minecraft_version in ['1.21.2', '1.21.3'] && path.endsWith('/MixinRenderSectionManager.java')) {
                    // Chunk-cache indices wrap as the camera moves. Verify the
                    // requested coordinates before ingesting a chunk during
                    // Sodium's removal callback (the 1.20.6 death-move fix).
                    contents = contents.replace(
                            'core.enqueueIngest(this.level.getChunk(x, z));',
                            'var chunk = this.level.getChunk(x, z);\n' +
                                    '            if (chunk != null && chunk.getPos().x == x && chunk.getPos().z == z) {\n' +
                                    '                core.enqueueIngest(chunk);\n' +
                                    '            }')
                }
                if (project.minecraft_version in ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4'] && path.endsWith('/MixinWorldRenderer.java')) {
                    contents = contents.replace('import me.cortex.voxy.client.config.VoxyConfig;',
                            'import me.cortex.voxy.client.config.VoxyConfig;\nimport me.cortex.voxy.client.config.LegacyVoxySupport;')
                    contents = contents.replace('if (VoxyConfig.CONFIG.enabled) {',
                            'if (VoxyConfig.CONFIG.enabled && VoxyConfig.CONFIG.enableRendering && LegacyVoxySupport.isRenderingSupported()) {')
                    contents = contents.replace('if (this.world != null && VoxyConfig.CONFIG.enabled) {',
                            'if (this.world != null && VoxyConfig.CONFIG.enabled && VoxyConfig.CONFIG.enableRendering && LegacyVoxySupport.isRenderingSupported()) {')
                }
                if (project.minecraft_version in ['1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'] && path.endsWith('/MixinRenderSectionManager.java')) {
                    // Sodium 0.7+ added SortBehavior to RenderSectionManager's constructor.
                    contents = contents.replace(
                            'import net.caffeinemc.mods.sodium.client.render.chunk.RenderSectionManager;',
                            'import net.caffeinemc.mods.sodium.client.render.chunk.RenderSectionManager;\n' +
                                    'import net.caffeinemc.mods.sodium.client.render.chunk.translucent_sorting.SortBehavior;')
                    contents = contents.replace(
                            'int renderDistance, CommandList commandList, CallbackInfo ci)',
                            'int renderDistance, SortBehavior sortBehavior, CommandList commandList, CallbackInfo ci)')
                    if (!contents.contains('int renderDistance, SortBehavior sortBehavior, CommandList commandList, CallbackInfo ci)')) {
                        throw new GradleException("Failed to adapt Sodium 0.7+ RenderSectionManager constructor for ${project.minecraft_version}")
                    }
                }
                if (project.minecraft_version in ['1.21.1', '1.21.6', '1.21.7'] && path.endsWith('/ShaderLoader.java')) {
                    // Sodium 0.7 returns ParsedShader; reuse its compatible
                    // loader bridge, including a leading GLSL version directive.
                    contents = providers.exec {
                        commandLine 'git', 'show', "upstream/mc_1217:${path}"
                    }.standardOutput.asText.get()
                }
                if (project.minecraft_version in ['1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'] && path.endsWith('/MixinDefaultChunkRenderer.java')) {
                    contents = contents.replaceAll('FogParameters [A-Za-z0-9_]+, CallbackInfo ci\\)', 'FogParameters parameters, boolean indexedRenderingEnabled, CallbackInfo ci)')
                    if (contents.contains('fogParameters')) {
                        contents = contents.replace('fogParameters', 'parameters')
                    }
                    if (!contents.contains('boolean indexedRenderingEnabled')) {
                        throw new GradleException("Failed to adapt Sodium 0.7+ DefaultChunkRenderer injection for ${project.minecraft_version}")
                    }
                }
                if (project.minecraft_version in ['1.21', '1.21.1']) {
                    // Sodium 0.6+ moved out of the legacy me.jellysquid
                    // namespace. Keep each port's Minecraft/Yarn source,
                    // but adapt its Sodium-facing compilation seams.
                    contents = contents.replace('me.jellysquid.mods.sodium', 'net.caffeinemc.mods.sodium')
                    if (project.minecraft_version == '1.21.1' && path.endsWith('/ShaderLoader.java')) {
                        contents = contents.replace('ShaderParser.parseShader("#import <" + id + ">", ShaderConstants.builder().build())',
                                'ShaderParser.parseShader("#import <" + id + ">", ShaderConstants.builder().build()).src()')
                    }
                    if (path.endsWith('/MixinDefaultChunkRenderer.java')) {
                        // Sodium 0.7/0.8 adds indexedRenderingEnabled to render;
                        // Sodium 0.6.13 used by Minecraft 1.21 still has no such argument.
                        if (project.minecraft_version == '1.21.1') {
                            contents = contents.replace(
                                    'TerrainRenderPass renderPass, CameraTransform camera, CallbackInfo ci)',
                                    'TerrainRenderPass renderPass, CameraTransform camera, boolean indexedRenderingEnabled, CallbackInfo ci)')
                        }
                        // The mixin selector uses JVM internal names, so the package
                        // rewrite above must also update its slash-separated owner.
                        contents = contents.replace(
                                'Lme/jellysquid/mods/sodium/',
                                'Lnet/caffeinemc/mods/sodium/')
                        if (contents.contains('target = "Lme.jellysquid.mods.sodium') || contents.contains('target = "Lme/jellysquid/mods/sodium')) {
                            throw new GradleException("Failed to adapt DefaultChunkRenderer injection target for ${project.minecraft_version}")
                        }
                    }
                    if (path.endsWith('/MixinRenderSectionManager.java')) {
                        // Sodium 0.6+ renamed this field from world to level.
                        // A @Shadow compiles without validating the target,
                        // so the historical name otherwise fails at runtime.
                        contents = contents.replace('@Shadow @Final private ClientWorld world;',
                                '@Shadow @Final private ClientWorld level;')
                        contents = contents.replace('(world.worldRenderer)', '(this.level.worldRenderer)')
                        contents = contents.replace('world.getChunk(x, z)', 'this.level.getChunk(x, z)')
                        if (contents.contains('private ClientWorld world;')) {
                            throw new GradleException("Failed to adapt RenderSectionManager field for ${project.minecraft_version}")
                        }
                    }
                }
                if (project.minecraft_version in ['1.21', '1.21.1'] && path.endsWith('/MixinMinecraftClient.java')) {
                    // RenderDoc is optional; the historical source must not
                    // abort game initialization when its DLL is not installed.
                    contents = contents.replace('System.load(', '// System.load(')
                }
                if (project.minecraft_version in ['1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10']) {
                    contents = contents.replace('CpuLayout.CORES.length', 'Runtime.getRuntime().availableProcessors()')
                    if (path.endsWith('/VoxyClient.java')) {
                        contents = contents.replace('            BudgetBufferRenderer.init();',
                                '            if (systemSupported) {\n                BudgetBufferRenderer.init();\n            }')
                    }
                    if (path.endsWith('/MixinSodiumOptionsGUI.java')) {
                        contents = contents.replace('import me.cortex.voxy.client.config.VoxyConfigScreenPages;',
                                'import me.cortex.voxy.client.config.LegacySodiumConfigMenu;')
                        contents = contents.replace('import me.cortex.voxy.client.config.VoxyConfigPageSodium;',
                                'import me.cortex.voxy.client.config.LegacySodiumConfigMenu;')
                        contents = contents.replace('        if (VoxyCommon.isAvailable()) {\n            this.pages.add(VoxyConfigScreenPages.voxyOptionPage = VoxyConfigScreenPages.page());\n        }',
                                '        this.pages.add(LegacySodiumConfigMenu.createPage());')
                        contents = contents.replace('        if (VoxyCommon.isAvailable()) {\n            this.pages.add(VoxyConfigPageSodium.voxyOptionPage = VoxyConfigPageSodium.page());\n        }',
                                '        this.pages.add(LegacySodiumConfigMenu.createPage());')
                        if (contents.contains('if (VoxyCommon.isAvailable())')) {
                            throw new GradleException("Failed to expose the Voxy Sodium page for ${project.minecraft_version}")
                        }
                    }
                    if (path.endsWith('/VoxyConfigScreenPages.java') || path.endsWith('/VoxyConfigPageSodium.java')) {
                        contents = contents.replace('.setControl(TickBoxControl::new)\n                        .setBinding((s, v)->{\n                            s.enableRendering = v;',
                                '.setControl(TickBoxControl::new)\n                        .setEnabled(() -> VoxyCommon.isAvailable())\n                        .setBinding((s, v)->{\n                            if (!VoxyCommon.isAvailable()) return;\n                            s.enableRendering = v;')
                        contents = contents.replace('}, s -> s.enableRendering)\n                        .setImpact(OptionImpact.HIGH)',
                                '}, s -> VoxyCommon.isAvailable() && s.enableRendering)\n                        .setImpact(OptionImpact.HIGH)')
                        if (!contents.contains('.setEnabled(() -> VoxyCommon.isAvailable())') ||
                                !contents.contains('if (!VoxyCommon.isAvailable()) return;')) {
                            throw new GradleException("Failed to guard the Voxy render option for ${project.minecraft_version}")
                        }
                    }
                    if (path.endsWith('/ModMenuIntegration.java')) {
                        contents = contents.replace('            if (VoxyCommon.isAvailable()) {\n', '')
                        contents = contents.replace('            } else {\n                return null;\n            }\n', '')
                        contents = contents.replace('VoxyConfigScreenPages.voxyOptionPage',
                                'LegacySodiumConfigMenu.getPage()')
                        contents = contents.replace('VoxyConfigPageSodium.voxyOptionPage',
                                'LegacySodiumConfigMenu.getPage()')
